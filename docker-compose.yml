services:
  postgres:
    # Versión pinneada explícitamente (nunca "latest", ver CLAUDE.md
    # sección 5/v1.7.0 PASO 5). alpine reduce superficie/tamaño de imagen
    # sin perder ninguna feature usada acá (sin extensiones exóticas).
    image: postgres:17-alpine
    container_name: pwc-tutor-postgres
    environment:
      # v1.7.0: credenciales de INFRAESTRUCTURA de base de datos, nunca
      # credenciales de un usuario funcional de la aplicación (ver
      # docs/SERVER_SIDE_PROFILE_V1_7.md). Nunca hardcodear una contraseña
      # real acá: los defaults son valores de desarrollo local documentados
      # en .env.example.
      POSTGRES_DB: ${POSTGRES_DB:-pwc_tutor}
      POSTGRES_USER: ${POSTGRES_USER:-pwc_tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwc_tutor_dev_password}
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado (no bind mount): persiste entre `down`/`up` sin
      # depender de una ruta de filesystem de Windows.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pwc_tutor} -d ${POSTGRES_DB:-pwc_tutor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pwc-tutor-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      CONTENT_DIR: /content
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-pwc}
      PWC_GENAI_BASE_URL: ${PWC_GENAI_BASE_URL:-https://genai-sharedservice-americas.pwcinternal.com}
      PWC_GENAI_API_KEY: ${PWC_GENAI_API_KEY:-}
      PWC_GENAI_MODEL: ${PWC_GENAI_MODEL:-openai.gpt-4o-2024-11-20}
      # Fallback de compatibilidad si PWC_GENAI_API_KEY no está definida.
      GEN_AI_API_KEY: ${GEN_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LESSON_CACHE_DIR: /app/data/lesson-cache
      LESSON_PROMPT_VERSION: ${LESSON_PROMPT_VERSION:-lesson-v3.3.1}
      CERTIFICATION_CACHE_DIR: /app/data/certification-cache
      CERTIFICATION_PROMPT_VERSION: ${CERTIFICATION_PROMPT_VERSION:-certification-v2}
      CERTIFICATION_ITEMS_PER_TOPIC: ${CERTIFICATION_ITEMS_PER_TOPIC:-6}
      CERTIFICATION_MAX_CONCURRENCY: ${CERTIFICATION_MAX_CONCURRENCY:-2}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-auto}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-marin}
      OPENAI_TTS_INSTRUCTIONS: ${OPENAI_TTS_INSTRUCTIONS:-}
      SPEECH_CACHE_DIR: /app/data/speech-cache
      APP_VERSION: ${APP_VERSION:-1.6.1}
      # v1.7.0: identidad + persistencia server-side (ver
      # docs/SERVER_SIDE_PROFILE_V1_7.md). El host "postgres" es el nombre
      # del service de arriba, resuelto vía la red interna de Compose.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pwc_tutor:pwc_tutor_dev_password@postgres:5432/pwc_tutor}
      # Único valor soportado en esta versión: "dev". Cualquier otro valor
      # (incluido "entra", reservado para una fase futura) falla el
      # arranque de la identidad con un error de configuración explícito
      # -- nunca un fallback silencioso (ver app/services/identity_provider.py).
      AUTH_MODE: ${AUTH_MODE:-dev}
    volumes:
      # Bind mount long-form: evita problemas de interpretación de rutas de
      # Windows que ocurren con la sintaxis corta "host:container".
      - type: bind
        source: ${COURSES_HOST_PATH:-./courses}
        target: /content
        read_only: true
      # Hot-reload del código del backend en desarrollo.
      - type: bind
        source: ./backend/app
        target: /app/app
      # Hot-reload de tests (evita rebuild de imagen al iterar con pytest).
      - type: bind
        source: ./backend/tests
        target: /app/tests
      # v1.7.0: hot-reload de migraciones Alembic (mismo patrón que app/tests).
      - type: bind
        source: ./backend/alembic
        target: /app/alembic
      - type: bind
        source: ./backend/alembic.ini
        target: /app/alembic.ini
        read_only: true
      # Cache local de LessonPlans (filesystem, lectura/escritura). Separado
      # del mount read-only de /content: acá el backend SÍ escribe.
      - type: bind
        source: ./data
        target: /app/data
      # v1.3.0 (Bloque 4, PARTE 28): mounts de solo lectura para que
      # tests/test_config_version_consistency.py pueda confirmar en CI que
      # LESSON_PROMPT_VERSION no diverge silenciosamente entre el default
      # de Python (Settings), .env.example y este mismo archivo -- el bug
      # concreto que ya se reprodujo dos veces (v1.1.0 y Bloque 3 de
      # v1.3.0). Nunca se escriben, solo se leen desde el test.
      - type: bind
        source: ./.env.example
        target: /app/.env.example
        read_only: true
      - type: bind
        source: ./docker-compose.yml
        target: /app/docker-compose.yml
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pwc-tutor-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      # Hot-reload del código del frontend en desarrollo.
      - type: bind
        source: ./frontend/src
        target: /app/src
      - type: bind
        source: ./frontend/index.html
        target: /app/index.html
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  # v1.7.0: datos de Postgres (app_users/user_identities). Persiste entre
  # `docker compose down` (sin -v) y `up`; solo se destruye con `down -v`
  # explícito.
  postgres_data:
